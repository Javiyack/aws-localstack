services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: kinesis,dynamodb,lambda,cloudwatch,sqs,secretsmanager,iam,s3
      DEFAULT_REGION: us-east-1
      DEBUG: "0"
      LAMBDA_EXECUTOR: local
      LAMBDA_JAVA_OPTS: "-Xmx512m"
      EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3333"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pipeline-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: pipeline-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10

  value-backend:
    build:
      context: ./value-backend
      dockerfile: Dockerfile
    container_name: value-backend
    ports:
      - "3333:3333"
    environment:
      PORT: "3333"
      HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: pipeline-dashboard
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:3333"
    depends_on:
      value-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  localstack_data:
  redis_data:
  postgres_data:
